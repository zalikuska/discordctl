name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # One cache for CI and Release (otherwise each job builds everything from scratch). Only main writes it:
          # a tag or a pull request gets its own copy that nobody else could use. A failed run still keeps what it built.
          shared-key: windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Build, test, package
        shell: pwsh
        run: |
          cargo build --release
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cargo test --release
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./scripts/package.ps1 -NoBuild
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/discordctl-*-windows-x64.zip
            dist/SHA256SUMS.txt
