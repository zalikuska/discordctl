name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE", "examples/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE", "examples/**"]

# A newer push to the same branch makes the unfinished run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # One cache for CI and Release (otherwise each job builds everything from scratch). Only main writes it:
          # a tag or a pull request gets its own copy that nobody else could use. A failed run still keeps what it built.
          shared-key: windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --release
      - run: cargo test --release
      - name: Sandbox end-to-end tests (fake Discord)
        shell: pwsh
        run: |
          powershell -NoProfile -File tests\e2e-shim.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          powershell -NoProfile -File tests\e2e-ops.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }

  payload:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: payload/package-lock.json
      - run: npm ci
        working-directory: payload
      - run: npm run build
        working-directory: payload
      - name: The committed bundle is up to date
        run: git diff --exit-code -- payload/dist/payload.js
