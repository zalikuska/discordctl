[package]
publish = false
name = "discordctl"
description = "Control your own Discord client from the terminal and from AI agents (MCP)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"

[[bin]]
name = "discordctl"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
clap_complete = "4"
console = "0.15"
crossterm = "0.28"
dialoguer = { version = "0.11", default-features = false }
discordctl-core.workspace = true
indicatif = "0.17"
miniz_oxide = "0.8"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
serde_json.workspace = true
windows-sys.workspace = true

[build-dependencies]
winresource = "0.1"
